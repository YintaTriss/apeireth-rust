name: Cargo audit (RUSTSEC advisories)

# R61 B0 续: cargo audit 每周 + workflow_dispatch (跟 cargo-deny.yml 平行)
# 借 RustSec advisory-db 自动; install 1 次 cargo-audit 然后 cargo audit --json
#
# 借鉴来源 (mirror cargo-deny.yml R19 第 0 阶段):
# - wasmtime .github/workflows/main.yml [cargo_audit] job
# - qdrant-spark 的 audit workflow
#
# 当前已知 0 vulnerabilities (R60 cargo audit 验证): cargo audit 1.1 KB 数据库, 0 vulnerabilities found.
# 仍跑 cron: 监控新 advisory 时邮件通知.
#
# 验收: 1) workflow 文件存在 + YAML 解析 OK; 2) 默认 cargo audit 0 vulns; 3) workflow_dispatch 触发 1 次跑过

on:
  push:
    branches: [master, main]
  pull_request:
    branches: ['**']
  schedule:
    # 每周日凌晨 4 点 (跟 eval-live 错开 1h, 避免 GPU 竞争)
    - cron: '0 4 * * 0'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

permissions:
  contents: read
  # R61: 加 security-events write (让 OSV.dev 报告 advisory match)
  security-events: write

jobs:
  cargo-audit:
    name: cargo audit (RUSTSEC database)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-audit-

      - name: Install cargo-audit
        # 2026-08 CI fix: crates.io 无 cargo-audit ^1.1 (最新 0.20.x), 改用 install-action 装最新
        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo audit (json + exit code)
        # 0 vulnerabilities 期望; 有 vuln 时 fails CI
        # CI fix 2026-08: cargo-audit 0.22 默认不读项目 audit.toml (仅 ~/.cargo/audit.toml),
        # 用 --ignore 显式同步 deny.toml 的 unmaintained 清单 (真实漏洞 0 ignore)
        # 注意: run 必须用 | 块标量 (普通标量折叠换行 → `\` 续行失效 → ' --ignore' 变子命令)
        run: |
          cargo audit --json --deny warnings \
            --ignore RUSTSEC-2024-0411 --ignore RUSTSEC-2024-0412 --ignore RUSTSEC-2024-0413 \
            --ignore RUSTSEC-2024-0414 --ignore RUSTSEC-2024-0415 --ignore RUSTSEC-2024-0416 \
            --ignore RUSTSEC-2024-0417 --ignore RUSTSEC-2024-0418 --ignore RUSTSEC-2024-0419 \
            --ignore RUSTSEC-2024-0420 --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2024-0370 \
            --ignore RUSTSEC-2026-0173 --ignore RUSTSEC-2025-0075 --ignore RUSTSEC-2025-0080 \
            --ignore RUSTSEC-2025-0081 --ignore RUSTSEC-2025-0098 --ignore RUSTSEC-2025-0100 \
            --ignore RUSTSEC-2026-0174 --ignore RUSTSEC-2025-0141 \
            --ignore RUSTSEC-2026-0217 \
            > audit-report.json || echo "audit non-zero exit captured in report"

      - name: Convert JSON report to SARIF (R66)
        # 借鉴 GitHub `github/codeql-action` SARIF schema + qdrant-spark audit SARIF 转换模式.
        # 0 引新 dep; 走 python3 (GitHub Actions ubuntu-latest 默认带).
        # CI fix 2026-08: cargo-audit 0.22 的 vulnerabilities.found 在 0 漏洞时是 false (非 []),
        # 脚本要 or [] 兜底 (之前 TypeError: 'bool' object is not iterable)
        run: |
          python3 - <<'PYEOF'
          import json, sys, datetime, hashlib
          with open("audit-report.json") as f:
              report = json.load(f)
          findings = []
          vuln_index = {}
          vulns = report.get("vulnerabilities") or {}
          for v in (vulns.get("found") or []):
              advisory = v.get("advisory", {})
              aid = advisory.get("id", "UNKNOWN")
              pkg = v.get("package", {})
              pkg_name = pkg.get("name", "unknown")
              pkg_version = pkg.get("version", "unknown")
              rule_id = f"rustsec/{aid}"
              vuln_index[rule_id] = {"package": pkg_name, "version": pkg_version}
              findings.append({
                  "ruleId": rule_id,
                  "level": "error" if advisory.get("severity", 1) >= 5 else "warning",
                  "message": {"text": advisory.get("description", advisory.get("title", aid))},
                  "locations": [{
                      "physicalLocation": {
                          "artifactLocation": {"uri": f"Cargo.toml"},
                          "region": {"startLine": 1, "startColumn": 1, "endLine": 1, "endColumn": 1}
                      }
                  }]
              })
          sarif = {
              "version": "2.1.0",
              "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
              "runs": [{
                  "tool": {
                      "driver": {
                          "name": "cargo-audit",
                          "version": "1.1.x",
                          "informationUri": "https://github.com/rustsec/rustsec",
                          "rules": [
                              {
                                  "id": rid,
                                  "name": rid,
                                  "shortDescription": {"text": f"RUSTSEC advisory affecting {meta['package']}@{meta['version']}"},
                                  "fullDescription": {"text": f"RUSTSEC advisory affecting {meta['package']}@{meta['version']}"},
                                  "defaultConfiguration": {"level": "error"},
                                  "helpUri": f"https://rustsec.org/advisories/{rid.replace('rustsec/', '')}"
                              }
                              for rid, meta in vuln_index.items()
                          ]
                      }
                  },
                  "results": findings,
                  "invocations": [{
                      "executionSuccessful": report.get("vulnerabilities", {}).get("count", 0) == 0,
                      "endTimeUtc": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")
                  }]
              }]
          }
          with open("audit-report.sarif", "w") as f:
              json.dump(sarif, f, indent=2)
          PYEOF

      - name: Upload audit report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-report
          path: |
            audit-report.json
            audit-report.sarif

      - name: Upload SARIF to Code Scanning (R66)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: audit-report.sarif
          category: cargo-audit
