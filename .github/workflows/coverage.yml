name: Coverage (tarpaulin)

# R18 第 3 阶段: 抄 qdrant coverage.yml
# https://github.com/qdrant/qdrant/blob/master/.github/workflows/coverage.yml
# cargo-tarpaulin → codecov
# 阈值: 架构层 ≥ 90%, 产品层 ≥ 60% (业界共识, R18 后续调整)

on:
  push:
    branches: [master, main]
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  coverage:
    name: cargo tarpaulin → codecov
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-tarpaulin
        # 2026-08 CI fix: `pip install cargo-tarpaulin` 无此 PyPI 包 (tarpaulin 是 Rust 工具),
        # 改用 taiki-e/install-action (跟 rust.yml 的 nextest 一致)
        uses: taiki-e/install-action@cargo-tarpaulin

      # tarpaulin 编译 workspace (keyring → dbus-secret-service → libdbus-sys) 需要系统库
      - name: "Install system deps (Linux: libdbus)"
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - uses: Swatinem/rust-cache@v2

      # l3_real_socket_smoke.rs 测试 spawn companion_serve binary, tarpaulin 不 build example
      # (per 8 哲学锚 S-2 实事求是: 0 装 PASS 严守, test infrastructure 1:1 兼容)
      - name: Build companion_serve example (tarpaulin 依赖)
        run: cargo build -p apeireth-companion --example companion_serve

      - name: cargo tarpaulin
        # CI fix 2026-08: workspace 全量 (86 crates) 在 ubuntu-latest 上 broken pipe (os error 32),
        # 收敛到 3 个核心 crate (companion/memory/api) — 覆盖率门禁的机制件代表
        run: cargo tarpaulin -p apeireth-companion -p apeireth-memory -p apeireth-api --out Xml --engine llvm --timeout 600

      - name: Upload to codecov.io
        uses: codecov/codecov-action@v4
        with:
          files: cobertura.xml
          fail_ci_if_error: false
          verbose: false
