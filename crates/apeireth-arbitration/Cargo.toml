[package]
name = "apeireth-arbitration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Apeireth R145: HASH-SQL 仲裁 + 唯一事实时间线. 跨前端/群聊/邮箱/Agent 通讯 1 套 SQL, content_hash 决定 canonical order. 上升为 Rust 编译期保证, 字段级复刻 HASH-SQL 仲裁 (开源项目 origin). 2 src / 13 测试 + 2 Kani"
keywords = ["ai", "agent", "arbitration", "timeline", "csl", "hash-sql"]
categories = ["data-structures", "database"]

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = "0.10"
hex = "0.4"
async-trait = { workspace = true }
rusqlite = { workspace = true }
parking_lot = "0.12"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["full"] }
apeireth-host = { path = "../apeireth-host" }
ureq = { version = "2", default-features = false, features = ["json", "tls"] }

[[example]]
name = "smoke_journal"
# Borrow smoke test: hash-chained journal + atomic_write end-to-end.
# 验证 3 项 P0 借鉴 (atomic_write / fail_closed / journal) 可组装运行.

[[example]]
name = "smoke_real_llm"
# 真 LLM 集成 smoke: 真调 MiniMax API + 写 journal + 验链.

[lints]
workspace = true
