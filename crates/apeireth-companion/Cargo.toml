[package]
name = "apeireth-companion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Apeireth companion organ (A12.5) - 长期跨 session 用户关系器官, 承载''用户是 AI 伙伴'' 语义. 基于 apeireth-graph-primitive, 提供 Partner / Bond / Milestone / Timeline / Companion 核心类型."

[dependencies]
apeireth-core = { path = "../apeireth-core" }
apeireth-graph-primitive = { path = "../apeireth-graph-primitive" }
apeireth-consciousness = { path = "../apeireth-consciousness" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
sha2 = "0.10" # S6: session_log 审计哈希链 FNV-1a 64 → SHA-256 (工作区已装版本复用, api/arbitration/keyring 同款)
async-trait = { workspace = true }
# TelegramSink (daemon) 真 HTTP: 复用 workspace reqwest 0.12 + rustls (同 LarkSink 走法).
reqwest = { workspace = true }
apeireth-memory = { path = "../apeireth-memory" }
# N2 OneRing: 账本表 + 迁移接口直连 SQLite (workspace 锁 0.32 bundled, 同 memory crate)
rusqlite = { workspace = true }
apeireth-lark = { path = "../apeireth-lark" }
apeireth-asi = { path = "../apeireth-asi" }
apeireth-council = { path = "../apeireth-council" }
apeireth-evolution = { path = "../apeireth-evolution" }
# TP18 校准/集合预报/预测市场 (E3 oracle 增强) — 主线程验收模拟直连
apeireth-cognition = { path = "../apeireth-cognition" }
# TP20-N20 ApprovalBridge — 跨 crate 审批透传契约 (companion ↔ team-lead orchestrator)
apeireth-team-lead = { path = "../apeireth-team-lead" }
apeireth-tool-registry = { path = "../apeireth-tool-registry" }
apeireth-tool-runtime = { path = "../apeireth-tool-runtime" }
apeireth-tool-approval = { path = "../apeireth-tool-approval" }
# N17/TP2: 9 工具子 crate 装配 (每个 register.rs 暴露统一注册函数)
apeireth-tool-shell = { path = "../apeireth-tool-shell" }
apeireth-tool-fetch = { path = "../apeireth-tool-fetch" }
apeireth-tool-browser = { path = "../apeireth-tool-browser" }
apeireth-tool-codesearch = { path = "../apeireth-tool-codesearch" }
apeireth-tool-image-gen = { path = "../apeireth-tool-image-gen" }
apeireth-tool-image-process = { path = "../apeireth-tool-image-process" }
apeireth-tool-search = { path = "../apeireth-tool-search" }
apeireth-tool-filesystem = { path = "../apeireth-tool-filesystem" }
apeireth-repo-tools = { path = "../apeireth-repo-tools" }
apeireth-tools = { path = "../apeireth-tools" }
apeireth-guard = { path = "../apeireth-guard" }
apeireth-sovereignty = { path = "../apeireth-sovereignty" }
apeireth-bus = { path = "../apeireth-bus" }

# TP25 (E3 增强): LightGBMProvider 纯 Rust ONNX 推理 (per spec 2026-08-20)
# 0 系统库 / 0 CMake / 0 MSVC - 替代 lightgbm-rs (C++ 编译链 Windows 0 pre-built)
tract-onnx = "0.21"
ndarray = "0.15"

# 2026-08-20 #5 smol-vm / libkrun 真接 (per reports/smol-vm-implementation-spec-2026-08-20.md):
# Phase 1 (commit 176a4003 + 949f2d2c) 纯 0 装 stub + 工厂 3 段 cfg 守门, feature 关闭.
# Phase 2 (本 commit) --features libkrun 启用真接 FFI:
#   - libkrun-sys = "0.9.7" optional dep (Red Hat 维护 KVM/HVF microVM 库 Rust binding, bindgen 0.71)
#   - lib.rs #![deny(unsafe_code)] -> #![cfg_attr(feature = "libkrun", allow(unsafe_code))] (cfg-gated)
#   - unsafe FFI 收敛在 sandbox_ffi_libkrun.rs 单文件 (#![allow(unsafe_code)] 内, 跟 job_object.rs:29 同模式)
# 主人决策 (2026-08-20): 全最强路线 — deny cfg-gated 放宽 + 真接 FFI + CI matrix.
# 默认 build (feature 关闭) = 0 装 PASS 1:1 兼容现状.
[features]
default = []
libkrun = ["dep:libkrun-sys"]

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libkrun-sys = { version = "0.9.7", optional = true }

# P3#16 microsandbox 落地: Windows Job Object 加固 (exec_worker 隔离层)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    # S1: SetEntriesInAclW / EXPLICIT_ACCESS_W / TRUSTEE_W (默认 DACL 放宽)
    "Win32_Security_Authorization",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    # B3 沙盒限额留痕: IO completion port (超限消息监听) + JOB_OBJECT_MSG 常量
    "Win32_System_IO",
    "Win32_System_SystemServices",
] }

[dev-dependencies]
tokio = { workspace = true }
tokio-stream = "0.1"
futures = "0.3"
apeireth-api = { path = "../apeireth-api" }
# TP29 (生态批): yaml_spec 与 tool_bridge 衔接测试用
tempfile = "3"
# companion_serve: 伙伴端点 (任何 OpenAI 兼容前端接入 Apeireth 主链路)
# axum 保持 0.7 (dev-dep, 2026-08 审计): 0.8 是破坏性升级 (路由语法 :id → {id}),
# P3 有意维持 0.7 — 见 crates/apeireth-api/README.md "依赖版本决策".
axum = { version = "0.7", features = ["macros"] }
# W6 前端联调: CorsLayer (与 apeireth-api 同版本 0.5, cors feature)
tower-http = { version = "0.5", features = ["cors"] }
uuid = { workspace = true }
chrono = { workspace = true }

[lib]
name = "apeireth_companion"
path = "src/lib.rs"

# 执行体隔离 worker: 高危工具 per-call 子进程 (被 ToolBridge 隔离模式 spawn)
[[bin]]
name = "exec_worker"
path = "src/bin/exec_worker.rs"

[[example]]
name = "companion_demo"
path = "examples/companion_demo.rs"

# R131.4 memory analyze_episode 真 LLM 实证 (R179 拆边后搬到 companion:
# memory 不能 dep apeireth-api, companion 有 memory 依赖 + api dev-依赖, 两边都够得着)
[[example]]
name = "r131_memory_analyze"
path = "examples/r131_memory_analyze.rs"

[lints]
workspace = true

